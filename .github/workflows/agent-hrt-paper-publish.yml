name: Publish concise HRT paper

on:
  push:
    branches:
      - agent/shorten-hrt-paper
    paths:
      - hrt-lambda0/paper/hrt-lambda0.tex
      - .github/workflows/agent-hrt-paper-publish.yml

permissions:
  contents: write

jobs:
  compile-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/shorten-hrt-paper
          fetch-depth: 0

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended

      - name: Compile paper
        working-directory: hrt-lambda0/paper
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error hrt-lambda0.tex
          pdflatex -interaction=nonstopmode -halt-on-error hrt-lambda0.tex
          test -s hrt-lambda0.pdf

      - name: Commit final PDF and remove one-time workflow
        run: |
          rm .github/workflows/agent-hrt-paper-publish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hrt-lambda0/paper/hrt-lambda0.tex hrt-lambda0/paper/hrt-lambda0.pdf .github/workflows/agent-hrt-paper-publish.yml
          git commit -m "Replace HRT paper with concise version"
          git push origin HEAD:agent/shorten-hrt-paper
