name: Build Basile 7.1 paper

on:
  push:
    branches: [main]
    paths:
      - 'erdos361/basile7_1/basile7_1.tex'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra

      - name: Compile paper
        working-directory: erdos361/basile7_1
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error basile7_1.tex

      - name: Commit generated PDF
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add erdos361/basile7_1/basile7_1.pdf
          if ! git diff --cached --quiet; then
            git commit -m 'erdos361: build Basile 7.1 paper'
            git push
          fi
