name: One-off Sendov paper author update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-principia-author.yml'

permissions:
  contents: write

jobs:
  update-paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set Principia Math as author
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('sendov9-11/paper/sendov9-11.tex')
          text = source.read_text(encoding='utf-8')
          old = r'\author{Anton Shakov}'
          new = r'\author{Principia Math}'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one {old!r}, found {text.count(old)}')
          source.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Install LaTeX and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra poppler-utils

      - name: Compile paper
        working-directory: sendov9-11/paper
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error sendov9-11.tex

      - name: Verify author in source and PDF
        run: |
          grep -F '\author{Principia Math}' sendov9-11/paper/sendov9-11.tex
          pdftotext sendov9-11/paper/sendov9-11.pdf - | grep -F 'Principia Math'

      - name: Commit the source and rebuilt PDF
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sendov9-11/paper/sendov9-11.tex sendov9-11/paper/sendov9-11.pdf
          git rm .github/workflows/oneoff-principia-author.yml
          git commit -m 'Set Principia Math as Sendov paper author [skip ci]'
          git push
