formalization:
  scope: >-
    Lean 4 + Mathlib formalization of Sendov's conjecture in degree nine: every complex
    polynomial of degree nine with all zeros in the closed unit disk has, for each zero a,
    a zero of the derivative within distance one of a. This is the paper's Theorem 1.1,
    formalized in full and UNCONDITIONALLY — there are no carried hypotheses and no
    literature axioms. The two finite positivity checks of the paper (§5, §6) are carried
    out inside Lean as nineteen exact integer-scaled Bernstein certificates discharged by
    `decide`, not by an external verifier; no floating point and no `native_decide` is
    used anywhere. The sorry counts below exclude `Challenge.lean` (the statement-only
    Comparator fixture; 6 intentional placeholders).

    PART II of this directory extends the SAME unconditional result to degrees ten and
    eleven (`Sendov1011/`, `Sendov911Bern`, `boxes10/`, `boxes11v2/`,
    `Sendov911Capstone`): the box certificates are kernel-checked by `decide` on exact
    integers (degree 10: 51/51; degree 11: 531/531 regenerated v2 boxes at c4 = 1447/50),
    and the analytic reduction — formerly the named hypothesis `CertificateReduction` —
    is now PROVED for both degrees, so `SendovN.Final10.sendov10` and
    `SendovN.Final11.sendov11` are unconditional theorems with the clean axiom triple.
    Grace-Walsh-Szego is consumed from the degree-9 development's parametric proof, so
    degrees ten and eleven also carry no literature dependency. The statement layer
    (`Sendov1011/SendovNStatement.lean`, surfaced in Challenge.lean/Solution.lean) adds
    monic and general forms in pure Mathlib vocabulary for both degrees; Challenge.lean
    now carries 6 intentional sorry placeholders (two per degree).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "Sendov9.Final.sendov_degree_nine_general"
      file: "Sendov9/Final.lean  (statement layer: Sendov9.Statement.sendov_degree_nine_general)"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator/sendov9_general.json"
      literature_dependencies: []
      note: >-
        The paper's Theorem 1.1, without the monic normalization. This is the headline
        result.
    - declaration: "Sendov9.Final.sendov_degree_nine"
      file: "Sendov9/Final.lean  (statement layer: Sendov9.Statement.sendov_degree_nine)"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator/sendov9_monic.json"
      literature_dependencies: []
      note: >-
        The monic form, matching the paper's `p(z) = ∏(z - z_k)`. The general form above is
        derived from it by scaling.
    - declaration: "Sendov1011.Statement.sendov_degree_ten_general"
      file: "Sendov1011/SendovNStatement.lean  (statement layer: Challenge.lean / Solution1011.lean)"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator/sendov10.json"
      comparator_status: "NOT YET RUN — config shipped; dispatched by sendov1011-full.yml"
      literature_dependencies: []
      note: >-
        Sendov's conjecture in degree ten, general (non-monic) form; the monic form
        `sendov_degree_ten` is named by the same comparator config. Proved
        unconditionally via `SendovN.Final10.sendov10` (analytic reduction +
        51 kernel-checked box certificates). The axioms field records the local
        `#print axioms` result; Comparator has not yet audited this declaration.
    - declaration: "Sendov1011.Statement.sendov_degree_eleven_general"
      file: "Sendov1011/SendovNStatement.lean  (statement layer: Challenge.lean / Solution1011.lean)"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator/sendov11.json"
      comparator_status: "NOT YET RUN — config shipped; dispatched by sendov1011-full.yml"
      literature_dependencies: []
      note: >-
        Sendov's conjecture in degree eleven, general (non-monic) form; the monic form
        `sendov_degree_eleven` is named by the same comparator config. Proved
        unconditionally via `SendovN.Final11.sendov11` (analytic reduction +
        531 kernel-checked v2 box certificates, c4 = 1447/50). The axioms field records
        the local `#print axioms` result; Comparator has not yet audited this declaration.
    - declaration: "Sendov9.GWS.graceWalshSzegoPos"
      file: "Sendov9/GWS.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      literature_dependencies: []
      note: >-
