# `Sendov1011Core` is the BOX-INDEPENDENT part of the degrees-10/11 development: exactly
# those modules of `Sendov1011/` whose transitive import closure contains no file from
# `boxes10/` or `boxes11v2/`. It is the parametric machinery — the interval/Bernstein data
# layer, the σ/J/E-symmetric-function estimates, the separation and splitting lemmas, the
# row and small-|a| reductions — everything up to but not including the point where a
# generated `hEq`/`ring` identity cites a concrete certificate.
#
# The 21 modules below were computed, not guessed, by walking the `import` graph; the
# other 70 modules of `Sendov1011` are box-dependent (`SendovNStatement` alone pulls in
# all 582). This library exists so the per-push CI job can regression-test the 10/11
# framework in minutes instead of hours: `.github/workflows/sendov9-11-build.yml` builds
# it, while the boxes and the assembly layer are checked by the two `workflow_dispatch`
# jobs `sendov1011-boxes.yml` and `sendov1011-full.yml`.
#
# It shares `srcDir` with `Sendov1011` on purpose — no file is moved or renamed, and the
# oleans land at the same paths, so this is a pure re-labelling of a subset for build
# targeting. Not a default target.
[[lean_lib]]
name = "Sendov1011Core"
srcDir = "Sendov1011"
globs = [
  "SendovNData", "SendovNCore", "SendovNBridge",
  "SendovNSigma", "SendovNJBound", "SendovNEsp",
  "SendovNEsp10", "SendovNEsp11", "SendovNEsymm",
  "SendovNEInt", "SendovNSep10", "SendovNSep11",
  "SendovNMidChain", "SendovNSplit11", "SendovNRows10",
  "SendovNRows11", "SendovNSmall10", "SendovNSmall11",
  "SendovNRotData", "SendovNCoverGrid", "SendovNEmajEq",
]

# The four degree-10/11 statements, proved. Its import closure is `SendovNStatement`, hence
# the ENTIRE 582-box corpus (~10 CPU-hours of kernel `decide`) — which is precisely why it
# is a separate library from `Solution`. Comparator's `comparator/sendov10.json`,
# `comparator/sendov11.json` and `comparator/all1011.json` name it as `solution_module`.
# Not a default target.
[[lean_lib]]
name = "Solution1011"

