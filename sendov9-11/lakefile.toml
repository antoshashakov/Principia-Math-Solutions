name = "Sendov9"
defaultTargets = ["Sendov9"]

# These are the development environment's options verbatim
# (PrincipiaAI `Principia Application/LeanSandbox/lakefile.toml`), so that this standalone
# project elaborates the same files under the same settings that gated them.
[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.31.0"

[[lean_lib]]
name = "Sendov9"

# Comparator (github.com/leanprover/comparator) requires the trusted statement file and
# the claimed proof to be separate libraries.
[[lean_lib]]
name = "Challenge"

# `Solution` holds the two DEGREE-NINE statements only; its import closure is the 46-module
# `Sendov9` library and Mathlib, so it is cheap. The four degree-10/11 statements live in
# `Solution1011` (below), whose closure is the entire 582-box corpus. Splitting the
# solution layer this way is what keeps the per-push CI job affordable; the repository
# already ships more than one solution module where that is the right shape (`erdos1054/`
# has three, one bridge per master). The single trusted `Challenge.lean` is shared by both:
# it imports Mathlib and nothing else.
[[lean_lib]]
name = "Solution"

# ---------------------------------------------------------------------------------------
# Degrees ten and eleven (see VERIFICATION.md Part II — now PROVED).
# None of these are default targets: `lake build` still builds exactly the certified
# degree-nine library. The box certificate files are registered through the glob
# libraries `Sendov911Boxes10` / `Sendov911Boxes11` at the end of this file, because the
# degrees-10/11 assembly layer imports them.
# ---------------------------------------------------------------------------------------

# The Bernstein certificate engine (representation + bound directions, integer bridge).
[[lean_lib]]
name = "Sendov911Bern"

# The conditional capstone: CertificateReduction n boxes → CoveringPositive boxes → Sendov n.
[[lean_lib]]
name = "Sendov911Capstone"

# The earlier supporting-lemma file for the degrees 9–11 paper (states PaperMainTheorem;
# does not conclude it).
[[lean_lib]]
name = "Sendov9to11"

# Wires two REAL boxes (Box10_40 + Box10Boundary) into the capstone, deriving
# `sendov10_of_reduction`. Build with `lake build IntegrationCheck`. (The individual box
# modules it imports resolve through the `Sendov911Boxes10` glob library below, which
# replaced the earlier per-box registrations.)
[[lean_lib]]
name = "IntegrationCheck"
# ---------------------------------------------------------------------------------------
# Degrees ten and eleven — PROVED (see VERIFICATION.md Part II).
# Still none of these are default targets: `lake build` builds exactly the certified
# degree-nine library, as before.
#
# `Sendov1011` is the full degrees-10/11 development (the parametric SendovN core, the
# generated certificate-identity/assembly layer, and the two final theorems
# `SendovN.Final10.sendov10` / `SendovN.Final11.sendov11`). Its import closure pulls in
# every box certificate below, so `lake build Sendov1011` builds the ENTIRE proof
# (~10 CPU-hours of kernel `decide` for the 582 boxes).
#
# The box files keep their original flat module names (byte-identical to the files that
# were kernel-checked, logs in certlogs1011/ and certlogs11v2/); the `globs` lists make
# those flat names resolvable to the srcDirs without renaming a single verified file.
# ---------------------------------------------------------------------------------------

[[lean_lib]]
name = "Sendov1011"
srcDir = "Sendov1011"
globs = [
  "Sendov10Final", "Sendov11Final", "SendovNBdryEq10",
  "SendovNBdryEq11", "SendovNBoxEq10_40", "SendovNBridge",
  "SendovNCore", "SendovNCoverGrid", "SendovNCovering10",
  "SendovNCovering11", "SendovNData", "SendovNEInt",
