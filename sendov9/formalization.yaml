      module: "Sendov9/Final.lean"
      status: "proved, axiom-free"
    - paper_result: "Proposition 5.1 / Lemma 5.2, the range 9/20 ≤ a ≤ 9/10 (eighteen certificates)"
      lean_name: "Sendov9.MidRows.mid_excluded"
      module: "Sendov9/MidRows.lean"
      status: "proved, axiom-free"
    - paper_result: "Lemma 6.1, the boundary range 9/10 ≤ a ≤ 1"
      lean_name: "Sendov9.TopRow.top_excluded"
      module: "Sendov9/TopRow.lean"
      status: "proved, axiom-free"
    - paper_result: "§7, completion of the proof (rotation to a real distinguished zero)"
      lean_name: "Sendov9.RotData.exists_data"
      module: "Sendov9/RotateData.lean"
      status: "proved, axiom-free"
    - paper_result: "§8, exact Bernstein verification (the nineteen certificates)"
      lean_name: "Sendov9.Cert.*"
      module: "Sendov9/CertData.lean"
      status: "proved, axiom-free, by `decide` on integer-scaled coefficients"
