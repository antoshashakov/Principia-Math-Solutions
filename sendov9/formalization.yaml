version: "v0.3"

project:
  name: "Sendov's conjecture in degree nine, in Lean 4"
  authors:
    - "Principia Math harness (autonomous multi-model research harness)"
  license: "Apache-2.0"

sources:
  - title: "Sendov's Conjecture in Degree Nine"
    authors:
      - "Anton Shakov"
    id: "paper/sendov9.pdf"
    type: "manuscript"
    license: "Apache-2.0"
    author_contacted: "author is the repository owner"
    note: >-
      The exact manuscript the Lean is checked against is committed at `paper/sendov9.tex`
      and `paper/sendov9.pdf`, both pinned by sha256 in `VERIFICATION.md`. The mathematics
      is the author's; the contribution of this directory is the machine-checked
      verification. Theorem 1.1 (the main theorem) is formalized in full and is
      unconditional. Sections 2–8 are formalized as the chain that proves it.
  - title: "On the Sendov conjecture for polynomials with at most six distinct roots"
    authors:
      - "Johnny E. Brown"
      - "Guangping Xiang"
    id: "J. Math. Anal. Appl. 232 (1999) 272–292"
    type: "literature"
    license: "n/a"
    author_contacted: "n/a"
    note: >-
      Prior art: settles Sendov for degree n ≤ 8. Not used by this formalization; recorded
      because it is what makes degree nine the open case.
  - title: "Sendov's conjecture for sufficiently high degree polynomials"
    authors:
      - "Terence Tao"
    id: "arXiv:2012.04125, Acta Math. 229 (2022) 347–392"
    type: "literature"
    license: "n/a"
    author_contacted: "n/a"
    note: >-
      Prior art: settles all sufficiently large n, with no effective bound, so it leaves
      degree nine open. Not used by this formalization.
  - title: "The proof of Sendov's conjecture"
    authors:
      - "Xiaoshen Meng"
    id: "arXiv:1705.07235"
    type: "literature"
    license: "n/a"
    author_contacted: "n/a"
    note: >-
      The only prior claim covering degree nine. Unpublished since 2018 and publicly
      doubted; recorded for honesty about the state of the literature. Not used here, and
      no assessment of it is made or implied.
  - title: "Grace–Walsh–Szegő coincidence theorem; Grace's apolarity theorem; Laguerre's theorem"
    authors:
      - "J. H. Grace"
      - "J. L. Walsh"
      - "G. Szegő"
      - "E. Laguerre"
    id: "classical (Grace 1902; Walsh 1922; Szegő 1922)"
    type: "literature"
    license: "n/a"
    author_contacted: "n/a"
    note: >-
      These drive the paper's Lemma 2.1. They are NOT in Mathlib and are NOT assumed here:
      all three are PROVED in this development (`Sendov9/Laguerre*.lean` via `Grace2Lib`,
      `Sendov9/GWS.lean`). To the best of our knowledge no formalization of Grace's
      apolarity theorem existed in any proof assistant before this. Consequently the
      formalization has NO literature dependency at all.

formalization:
  scope: >-
    Lean 4 + Mathlib formalization of Sendov's conjecture in degree nine: every complex
    polynomial of degree nine with all zeros in the closed unit disk has, for each zero a,
    a zero of the derivative within distance one of a. This is the paper's Theorem 1.1,
    formalized in full and UNCONDITIONALLY — there are no carried hypotheses and no
    literature axioms. The two finite positivity checks of the paper (§5, §6) are carried
    out inside Lean as nineteen exact integer-scaled Bernstein certificates discharged by
    `decide`, not by an external verifier; no floating point and no `native_decide` is
    used anywhere. The sorry counts below exclude `Challenge.lean` (the statement-only
    Comparator fixture; 2 intentional placeholders).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "Sendov9.Final.sendov_degree_nine_general"
      file: "Sendov9/Final.lean  (statement layer: Sendov9.Statement.sendov_degree_nine_general)"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator/sendov9_general.json"
      literature_dependencies: []
      note: >-
        The paper's Theorem 1.1, without the monic normalization. This is the headline
        result.
    - declaration: "Sendov9.Final.sendov_degree_nine"
      file: "Sendov9/Final.lean  (statement layer: Sendov9.Statement.sendov_degree_nine)"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator/sendov9_monic.json"
      literature_dependencies: []
      note: >-
        The monic form, matching the paper's `p(z) = ∏(z - z_k)`. The general form above is
        derived from it by scaling.
    - declaration: "Sendov9.GWS.graceWalshSzegoPos"
      file: "Sendov9/GWS.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      literature_dependencies: []
      note: >-
        The Grace–Walsh–Szegő coincidence theorem, proved (not assumed), via Laguerre's
        theorem and Grace's apolarity theorem. Of independent interest.

automation:
  proof_assistant: "Lean 4"
  mathlib: "rev fabf563a7c95a166b8d7b6efca11c8b4dc9d911f (tag v4.31.0)"

fidelity:
  divergences:
    - >-
      The Lean statement quantifies over `p : ℂ[X]` with `p.natDegree = 9` and
      `∀ w ∈ p.roots, ‖w‖ ≤ 1`; the paper writes `p(z) = ∏_{k=1}^{9}(z - z_k)` with
      `|z_k| ≤ 1`. Over ℂ these are the same hypothesis (a degree-nine polynomial has
      exactly nine roots with multiplicity), and the Lean form is the weaker one, since it
      does not assume monicity.
    - >-
      The paper's separation constant is `2 sin(π/9)`. The formalization never introduces
      `Real.sin`: `2 cos(2π/9)` enters only as the largest root of `t³ - 3t + 1`, bounded
      above by the rational `1536239/1000000`, which is what yields the constant
      `681/1000 < 2 sin(π/9)` the certificates need. This is a strictly rational
      strengthening of the same step, not a divergence in the result.
    - >-
      The paper's ancillary Python verifiers (`verify_interior.py`, `verify_boundary.py`)
      are NOT the certificate check used here. The nineteen certificates are re-derived
      independently (`gen_cert_data.py` in the development repo, written against the LaTeX)
      and checked by Lean's kernel on integer arithmetic.
  no_known_divergences_in: >-
    Theorem 1.1 as stated in the paper versus
    `Sendov9.Statement.sendov_degree_nine_general` as stated in `Challenge.lean`.

review:
  comparator: >-
    Runs on CI (.github/workflows/sendov9-comparator.yml), Linux-only, in a
    landrun/Landlock sandbox: comparator/sendov9_general.json and
    comparator/sendov9_monic.json, both axiom-free (permitted axioms are exactly propext,
    Quot.sound, Classical.choice). Both must report "Your solution is okay!".
  non_vacuity: >-
    `Sendov9.NonVacuous.sanity` applies the main theorem to `p = X⁹` and obtains an actual
    critical point, so the hypotheses are satisfiable. This check exists because the one
    real defect found during the formalization was a VACUOUSLY TRUE carried hypothesis (see
    `Sendov9/GWSFix.lean`), a failure mode that `#print axioms` cannot detect.

alignment:
  statements:
