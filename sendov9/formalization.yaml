      lean_name: "Sendov9.Statement.sendov_degree_nine_general"
      module: "Challenge.lean / Solution.lean (proved from Sendov9/Final.lean)"
      status: "proved, axiom-free, unconditional"
    - paper_result: "Theorem 1.1, monic form as written in the paper"
