      status: "proved, axiom-free, unconditional"
    - paper_result: "Lemma 2.1 (separation from a zero: |a - z_k| > 2 sin(π/9))"
      lean_name: "Sendov9.Final.separation"
      module: "Sendov9/Final.lean (from GWS.lean + Segment.lean + RootUnity.lean)"
