name = "Sendov9"
defaultTargets = ["Sendov9"]

# These are the development environment's options verbatim
# (PrincipiaAI `Principia Application/LeanSandbox/lakefile.toml`), so that this standalone
# project elaborates the same files under the same settings that gated them.
[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.31.0"

[[lean_lib]]
name = "Sendov9"

# Comparator (github.com/leanprover/comparator) requires the trusted statement file and
# the claimed proof to be separate libraries.
[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"
